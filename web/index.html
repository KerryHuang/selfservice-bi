<script id="engine">
(function (global) {
'use strict';
/* 前端只留「不需要資料」的純規則（驗證、描述、選項）。
   目錄（FIELDS／TOPICS／OPS…）由 GET /api/meta 回來後呼叫 Engine.init(meta) 載入；
   需要資料的運算（run／chart／drill／chart-options）全部走後端 API。 */
var TODAY = '', FIELDS = {}, TOPICS = {}, OPS = {}, RANGE_LABELS = {}, DATE_FIELDS = {}, AGG_LABELS = {}, _fmap = {};

/* ---------- 日期工具（只供「本月、近 3 個月…」的區間顯示） ---------- */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function parseD(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function fmtD(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function addDays(s, n) { var d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return fmtD(d); }
function addMonths(s, n) {
  var d = parseD(s), day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n);
  var dim = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, dim)); return fmtD(d);
}
function monthEnd(s) { var d = parseD(s); return fmtD(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0))); }
function monthStart(s) { return s.slice(0, 8) + '01'; }
function weekStart(s) { var d = parseD(s), k = (d.getUTCDay() + 6) % 7; return addDays(s, -k); }

/* ---------- 欄位目錄 ---------- */
function fieldMap(topic) {
  if (_fmap[topic]) return _fmap[topic];
  var m = {}; (FIELDS[topic] || []).forEach(function (f) { m[f.id] = f; }); _fmap[topic] = m; return m;
}
function getField(topic, id) { return (fieldMap(topic) || {})[id] || null; }
function relGroups(topic) { return (TOPICS[topic] && TOPICS[topic].related) || []; }
function fieldAvail(def, f) { return relGroups(def.topic).indexOf(f.grp) < 0 || !!(def.related && def.related[f.grp]); }
/* 比率型彙總：ratio:<id>；onTimeRate 等同 ratio:onTime */
function isRatio(agg) { return agg === 'onTimeRate' || String(agg).indexOf('ratio:') === 0; }
function ratioOf(topic, agg) {
  if (!isRatio(agg)) return null;
  var id = agg === 'onTimeRate' ? 'onTime' : agg.slice(6), t = TOPICS[topic];
  return (t && t.ratios && t.ratios[id]) || null;
}
function ratioAggs(topic) {
  var t = TOPICS[topic]; if (!t || !t.ratios) return [];
  return Object.keys(t.ratios).map(function (id) { return id === 'onTime' && topic === 'orderLine' ? 'onTimeRate' : 'ratio:' + id; });
}
/* 比率需要但報表沒勾的相關資料群組（回傳群組名稱；都有回 null） */
function ratioMissing(def, agg) {
  var r = ratioOf(def.topic, agg); if (!r) return null;
  var rel = relGroups(def.topic);
  for (var i = 0; i < r.groups.length; i++) { var g = r.groups[i]; if (rel.indexOf(g) >= 0 && !(def.related && def.related[g])) return relLabel(def.topic, g); }
  return null;
}
function relLabel(topic, g) { var l = (TOPICS[topic].groups || {})[g] || g; return l.replace(/^相關資料：/, '').replace(/（.*?）$/, ''); }
function fieldLabel(topic, id) { var f = getField(topic, id); return f ? f.label : id; }

/* ---------- 日期區間 ---------- */
function resolveRange(key, from, to) {
  switch (key) {
    case 'thisWeek': return { from: weekStart(TODAY), to: addDays(weekStart(TODAY), 6) };
    case 'lastWeek': return { from: addDays(weekStart(TODAY), -7), to: addDays(weekStart(TODAY), -1) };
    case 'last8w': return { from: addDays(weekStart(TODAY), -49), to: addDays(weekStart(TODAY), 6) };
    case 'thisMonth': return { from: monthStart(TODAY), to: monthEnd(TODAY) };
    case 'lastMonth': var lm = addMonths(monthStart(TODAY), -1); return { from: lm, to: monthEnd(lm) };
    case 'last3m': return { from: addDays(addMonths(TODAY, -3), 1), to: TODAY };
    case 'last12m': return { from: addDays(addMonths(TODAY, -12), 1), to: TODAY };
    case 'thisYear': return { from: TODAY.slice(0, 4) + '-01-01', to: TODAY.slice(0, 4) + '-12-31' };
    case 'custom': return { from: from || '', to: to || '' };
    default: return null;
  }
}

/* ---------- 條件 ---------- */
function opLabel(type, op) { var l = OPS[type] || []; for (var i = 0; i < l.length; i++) if (l[i][0] === op) return l[i][1]; return op; }
function defaultOp(type) { return OPS[type][0][0]; }
function newCond(topic, fieldId) {
  var f = getField(topic, fieldId) || FIELDS[topic][0];
  return { id: 'c' + Math.random().toString(36).slice(2, 8), field: f.id, op: defaultOp(f.type), value: '', value2: '', values: [], from: '', to: '' };
}
function validateConditions(def) {
  var errs = [], topic = def.topic;
  ((def.filters && def.filters.rows) || []).forEach(function (c, idx) {
    var f = getField(topic, c.field), m = null;
    if (!f || !fieldAvail(def, f)) m = '欄位「' + (f ? f.label : c.field) + '」目前不可用（請確認相關資料已加入）';
    else if (f.type === 'text') { if ((c.op === 'contains' || c.op === 'eq') && !String(c.value || '').trim()) m = '請輸入要比對的文字'; }
    else if (f.type === 'number') {
      var v = parseFloat(c.value);
      if (c.value === '' || c.value == null || isNaN(v)) m = '請輸入數值';
      else if (c.op === 'between') {
        var v2 = parseFloat(c.value2);
        if (c.value2 === '' || isNaN(v2)) m = '「介於」需要填起、迄兩個數值';
        else if (v > v2) m = '起值不可大於迄值';
      }
    } else if (f.type === 'date') {
      if (c.op === 'custom') {
        if (!c.from || !c.to) m = '自訂區間需要填起、迄日期';
        else if (c.from > c.to) m = '起日不可晚於迄日';
      }
    } else if (f.type === 'enum') { if (!c.values || !c.values.length) m = '請至少勾選一個項目'; }
    if (m) errs.push({ code: 'COND_INCOMPLETE', condId: c.id, index: idx, short: m, step: 3, msg: '第 ' + (idx + 1) + ' 個條件：' + m });
  });
  return errs;
}
function describeCond(topic, c) {
  var f = getField(topic, c.field); if (!f) return c.field;
  var n = f.label;
  if (f.type === 'enum') return n + ' 屬於 ' + (c.values || []).join('、');
  if (f.type === 'date') {
    if (c.op === 'custom') return n + ' ' + (c.from || '?') + ' ～ ' + (c.to || '?');
    if (c.op === 'empty') return n + ' 是空的';
    var r = resolveRange(c.op); return n + ' ' + opLabel('date', c.op) + '（' + r.from + ' ～ ' + r.to + '）';
  }
  if (f.type === 'number') return n + ' ' + opLabel('number', c.op) + ' ' + c.value + (c.op === 'between' ? ' ～ ' + c.value2 : '');
  if (c.op === 'empty' || c.op === 'notEmpty') return n + ' ' + opLabel('text', c.op);
  return n + ' ' + opLabel('text', c.op) + ' 「' + c.value + '」';
}
function describeDef(def) {
  var t = [], rows = (def.filters && def.filters.rows) || [];
  rows.forEach(function (c) { t.push(describeCond(def.topic, c)); });
  return rows.length ? [(def.filters.logic === 'any' ? '符合以下任一條件：' : '符合以下全部條件：') + t.join('；')] : ['報表本身沒有設條件（全部資料）'];
}

/* ---------- 彙總標籤 ---------- */
function aggLabel(topic, agg) { var r = ratioOf(topic, agg); if (r) return r.label; return agg === 'count' ? TOPICS[topic].countLabel : AGG_LABELS[agg]; }
function metricDefaultLabel(topic, m) {
  var f = m.field ? getField(topic, m.field) : null;
  if (m.agg === 'sum') return (f ? f.label : '') + '合計';
  if (m.agg === 'avg') return '平均' + (f ? f.label : '');
  if (m.agg === 'max') return '最大' + (f ? f.label : '');
  if (m.agg === 'min') return '最小' + (f ? f.label : '');
  return aggLabel(topic, m.agg);
}
function metricLabel(topic, m) { return m.label || metricDefaultLabel(topic, m); }
function metricUnit(topic, m) {
  var rt = ratioOf(topic, m.agg); if (rt) return rt.unit || '%';
  if (m.agg === 'distinctOrders') return '張';
  if (m.agg === 'distinctShips') return '張';
  if (m.agg === 'count' || m.agg === 'distinctLines' || m.agg === 'overdueCount') return '筆';
  var f = m.field ? getField(topic, m.field) : null;
  if (!f) return '';
  if (f.kind === 'localMoney') return '本幣';
  if (f.kind === 'origMoney' || f.kind === 'origPrice') return '原幣';
  if (f.kind === 'qty') return '數量';
  return '';
}

/* ---------- 驗證（後端會再驗一次；前端先擋，才能立刻給「一鍵修正」） ---------- */
function singleOf(def, extra, field) {
